version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: savoria-mysql
    restart: unless-stopped
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: savoria
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  savoria-app:
    build: .
    container_name: savoria-restaurant-platform
    restart: unless-stopped
    depends_on:
      mysql-db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - RESTAURANT_NAME=Savoria Japanese Dining
      - RESTAURANT_WHATSAPP_NUMBER=6281234567890
      - TAX_RATE=0.10
      - SERVICE_FEE_RATE=0.05
      - DB_TYPE=mysql
      - MYSQL_HOST=mysql-db
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=
      - MYSQL_DB=savoria
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/database/info')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  mysql_data:
